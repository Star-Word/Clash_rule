name: Update AI Rules

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 02:15 运行一次
    # 北京/新加坡时间 = 10:15
    - cron: "15 2 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Build ai.yaml
        run: python scripts/build_ai_yaml.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai.yaml
          git diff --cached --quiet || git commit -m "chore: update ai.yaml"
          git push
